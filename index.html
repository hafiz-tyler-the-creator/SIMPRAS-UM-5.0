<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMPRAS-UM Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        blue: { 50: '#F0F7FF', 100: '#E0F2FE', 500: '#3B82F6', 600: '#2563EB' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 flex h-screen overflow-hidden">

    <aside class="w-20 md:w-64 bg-white border-r border-slate-200 flex-shrink-0 flex flex-col items-center md:items-stretch py-4 hidden sm:flex">
        <div class="px-4 md:px-6 mb-8 text-center md:text-left">
            <h2 class="text-xl font-bold text-blue-600 hidden md:block tracking-tight">SIMPRAS-UM</h2>
            <div class="md:hidden text-blue-600 font-bold text-xl">SU</div>
        </div>
        
        <nav class="flex flex-col gap-2 px-2 md:px-4 w-full">
            <a href="#" class="flex items-center justify-center md:justify-start gap-3 px-3 py-2.5 bg-blue-50 text-blue-600 rounded-lg hover:bg-blue-100 transition-colors duration-200 cursor-pointer">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span class="hidden md:block font-medium text-sm">Dashboard</span>
            </a>
            <a href="#" class="flex items-center justify-center md:justify-start gap-3 px-3 py-2.5 text-slate-500 rounded-lg hover:bg-slate-100 hover:text-slate-700 transition-colors duration-200 cursor-pointer">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                <span class="hidden md:block font-medium text-sm">Laporan</span>
            </a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
        <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-4 sm:px-6 lg:px-8 shrink-0">
            <div class="flex items-center gap-4">
                <button class="sm:hidden text-slate-500 hover:text-slate-700 transition-colors cursor-pointer">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <h1 class="text-xl md:text-2xl font-semibold text-slate-800">Dashboard Ketersediaan Ruangan</h1>
            </div>
            <div class="w-8 h-8 rounded-full bg-slate-200 border border-slate-300 flex items-center justify-center overflow-hidden cursor-pointer hover:ring-2 ring-blue-300 transition-all">
                <svg class="w-5 h-5 text-slate-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"></path></svg>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-4 sm:px-6 lg:px-8 pb-20">
            <section class="bg-[#EAF4FF] rounded-2xl p-5 mb-6 shadow-sm border border-blue-100">
                <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Tanggal</label>
                        <div class="bg-white rounded-lg px-3 py-2 border border-slate-200 flex items-center gap-2 text-sm text-slate-600 cursor-pointer hover:border-blue-400 transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                            Tahun 2024
                        </div>
                    </div>
                    
                    <div class="lg:col-span-1">
                        <label class="block text-sm font-medium text-slate-700 mb-2">Jam</label>
                        <div class="flex flex-wrap gap-2" id="filter-jam">
                            <span class="filter-btn active px-3 py-1 bg-blue-500 text-white border border-blue-500 rounded-full text-xs font-medium cursor-pointer transition-colors shadow-sm">07.00–09.35</span>
                            <span class="filter-btn px-3 py-1 bg-white border border-slate-200 rounded-full text-xs font-medium text-slate-600 cursor-pointer hover:border-blue-400 transition-colors">09.35–12.10</span>
                            <span class="filter-btn px-3 py-1 bg-white border border-slate-200 rounded-full text-xs font-medium text-slate-600 cursor-pointer hover:border-blue-400 transition-colors">13.10–15.45</span>
                            <span class="filter-btn px-3 py-1 bg-white border border-slate-200 rounded-full text-xs font-medium text-slate-600 cursor-pointer hover:border-blue-400 transition-colors">15.45–18.15</span>
                        </div>
                    </div>

                    <div class="lg:col-span-1 space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">Fakultas</label>
                            <div class="flex flex-wrap gap-2" id="filter-fakultas">
                                <span class="filter-btn active px-3 py-1 bg-blue-500 text-white border-blue-500 border rounded-full text-xs font-medium shadow-sm cursor-pointer transition-colors">FEB</span>
                                <span class="filter-btn px-3 py-1 bg-white border border-slate-200 rounded-full text-xs font-medium text-slate-600 cursor-pointer hover:border-blue-400 transition-colors">FS</span>
                                <span class="filter-btn px-3 py-1 bg-white border border-slate-200 rounded-full text-xs font-medium text-slate-600 cursor-pointer hover:border-blue-400 transition-colors">FIS</span>
                                <span class="filter-btn px-3 py-1 bg-white border border-slate-200 rounded-full text-xs font-medium text-slate-600 cursor-pointer hover:border-blue-400 transition-colors">FT</span>
                                <span class="filter-btn px-3 py-1 bg-white border border-slate-200 rounded-full text-xs font-medium text-slate-600 cursor-pointer hover:border-blue-400 transition-colors">FK</span>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">Gedung</label>
                            <div class="flex flex-wrap gap-2" id="filter-gedung">
                                <span class="filter-btn active px-3 py-1 bg-blue
